<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../assets/images/logo/favicon-32.png"><link rel="apple-touch-icon" href="../assets/images/logo/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — BrightPath Academy | School Tutoring Center</title>
  <meta name="description" content="Request a password reset link for your BrightPath Academy tutoring account. Receive secure instructions in your email.">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <!-- Theme & RTL FOUC Prevention Script -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('brightpath-theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var savedRTL = localStorage.getItem('brightpath-rtl');
        if (savedRTL === 'true') {
          document.documentElement.setAttribute('dir', 'rtl');
          document.documentElement.setAttribute('lang', 'ar');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="auth-page">
    <!-- Standalone Controls Toolbar -->
    <div style="position: absolute; top: var(--space-3); right: var(--space-3); display: flex; align-items: center; gap: var(--space-1); z-index: 10;">
      <button type="button" class="header-icon-btn theme-toggle-btn" aria-label="Toggle dark and light theme" title="Toggle theme">
        <span class="icon-sun" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
        <span class="icon-moon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </button>
      <button type="button" class="header-icon-btn rtl-toggle-btn" aria-label="Toggle RTL layout" title="Toggle RTL" style="font-family: var(--font-heading); font-weight: 700; font-size: 13px; color: var(--text-primary);">RTL</button>
    </div>

    <!-- Forgot Password Card -->
    <div class="auth-card reveal active">
      <a href="index.html" class="auth-logo" aria-label="BrightPath Academy Home">
        <div class="logo-icon"><img src="../assets/images/logo/logo-icon.svg" alt="" width="40" height="40"></div>
        <span class="logo-text">BrightPath</span>
      </a>

      <h1 class="auth-title">Forgot Password</h1>
      <p class="auth-subtitle">Enter your email to receive reset instructions</p>

      <!-- Information Banner -->
      <div style="padding: var(--space-2); background-color: var(--color-primary-lighter); border: 1px solid var(--color-primary-border); border-radius: var(--border-radius-sm); margin-bottom: var(--space-3); font-size: var(--fs-xs); color: var(--text-secondary); line-height: var(--lh-snug);">
        We will email you a secure link to reset your account password. Reset links remain active for 30 minutes.
      </div>

      <form id="forgotPasswordForm" data-validate="true" novalidate>
        <div class="form-group">
          <label for="forgot-email" class="form-label">Registered Email Address</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" id="forgot-email" name="email" class="form-input" placeholder="name@example.com" autocomplete="email" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="margin-top: var(--space-2);">Send Reset Link</button>
      </form>

      <!-- Sent Confirmation Notice (Simulated state) -->
      <div id="resetSuccessNotice" style="display: none; margin-top: var(--space-3); padding: var(--space-3); background-color: var(--color-primary-lighter); border: 1px solid var(--color-primary-border); border-radius: var(--border-radius-md); text-align: center;">
        <div style="width: 36px; height: 36px; border-radius: var(--border-radius-full); background-color: var(--color-primary-badge); color: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; margin-bottom: var(--space-1);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div style="font-size: var(--fs-sm); font-weight: var(--fw-semibold); color: var(--text-primary); margin-bottom: 4px;">Reset Instructions Sent</div>
        <p style="font-size: var(--fs-xs); color: var(--text-secondary); margin-bottom: 0;">Please check your email inbox and spam folder for the password reset link.</p>
      </div>

      <div class="auth-footer">
        <a href="login.html" style="display: inline-flex; align-items: center; gap: 6px; color: var(--color-primary); text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Login
        </a>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <script>
    // Enhance with clean user feedback if form validates
    document.getElementById('forgotPasswordForm').addEventListener('submit', function (e) {
      var emailInput = document.getElementById('forgot-email');
      if (emailInput && emailInput.value.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim())) {
        e.preventDefault();
        document.getElementById('forgotPasswordForm').style.display = 'none';
        document.getElementById('resetSuccessNotice').style.display = 'block';
      }
    });
  </script>
</body>
</html>
