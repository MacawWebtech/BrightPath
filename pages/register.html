<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="../assets/images/logo/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="../assets/images/logo/favicon-32.png"><link rel="apple-touch-icon" href="../assets/images/logo/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — BrightPath Academy | School Tutoring Center</title>
  <meta name="description" content="Register your parent and student profile with BrightPath Academy School Tutoring Center to enroll in personalized tutoring, track progress, and book batch timings.">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dark-mode.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <!-- Theme & RTL FOUC Prevention Script -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('brightpath-theme');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        var savedRTL = localStorage.getItem('brightpath-rtl');
        if (savedRTL === 'true') {
          document.documentElement.setAttribute('dir', 'rtl');
          document.documentElement.setAttribute('lang', 'ar');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="auth-page" style="padding-top: var(--space-5); padding-bottom: var(--space-5);">
    <!-- Standalone Controls Toolbar -->
    <div style="position: absolute; top: var(--space-3); right: var(--space-3); display: flex; align-items: center; gap: var(--space-1); z-index: 10;">
      <button type="button" class="header-icon-btn theme-toggle-btn" aria-label="Toggle dark and light theme" title="Toggle theme">
        <span class="icon-sun" style="display: none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
        <span class="icon-moon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
      </button>
      <button type="button" class="header-icon-btn rtl-toggle-btn" aria-label="Toggle RTL layout" title="Toggle RTL" style="font-family: var(--font-heading); font-weight: 700; font-size: 13px; color: var(--text-primary);">RTL</button>
    </div>

    <!-- Registration Card -->
    <div class="auth-card reveal active" style="max-width: 520px;">
      <a href="index.html" class="auth-logo" aria-label="BrightPath Academy Home">
        <div class="logo-icon"><img src="../assets/images/logo/logo-icon.svg" alt="" width="40" height="40"></div>
        <span class="logo-text">BrightPath</span>
      </a>

      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join BrightPath Academy to enroll students, track progress &amp; schedule tutoring</p>

      <form id="registerForm" data-validate="true" novalidate>
        <!-- Parent Full Name -->
        <div class="form-group">
          <label for="parent-name" class="form-label">Parent / Guardian Full Name</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="parent-name" name="parent-name" class="form-input" placeholder="Eleanor Vance" required>
          </div>
        </div>

        <!-- Student Full Name -->
        <div class="form-group">
          <label for="student-name" class="form-label">Student Full Name</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
            </span>
            <input type="text" id="student-name" name="student-name" class="form-input" placeholder="Leo Vance" required>
          </div>
        </div>

        <!-- Student Grade (1-12 Select) -->
        <div class="form-group">
          <label for="student-grade" class="form-label">Student Grade Level (Grades 1–12)</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <select id="student-grade" name="student-grade" class="form-select form-input" required>
              <option value="" disabled selected>Select student grade</option>
              <option value="1">Grade 1 (Primary)</option>
              <option value="2">Grade 2 (Primary)</option>
              <option value="3">Grade 3 (Elementary)</option>
              <option value="4">Grade 4 (Elementary)</option>
              <option value="5">Grade 5 (Elementary)</option>
              <option value="6">Grade 6 (Middle School)</option>
              <option value="7">Grade 7 (Middle School)</option>
              <option value="8">Grade 8 (Middle School)</option>
              <option value="9">Grade 9 (High School / Freshman)</option>
              <option value="10">Grade 10 (High School / Sophomore)</option>
              <option value="11">Grade 11 (High School / Junior)</option>
              <option value="12">Grade 12 (High School / Senior)</option>
            </select>
          </div>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label for="register-email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input type="email" id="register-email" name="email" class="form-input" placeholder="eleanor.vance@example.com" autocomplete="email" required>
          </div>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label for="register-phone" class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </span>
            <input type="tel" id="register-phone" name="phone" class="form-input" placeholder="+1 (555) 234-5678" autocomplete="tel" required>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="register-password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="register-password" name="password" class="form-input" placeholder="Create a password (min. 8 characters)" autocomplete="new-password" required minlength="8" style="padding-right: 44px;">
            <button type="button" class="password-toggle" aria-label="Toggle password visibility">
              <span class="icon-eye">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
              <span class="icon-eye-off" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </span>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="register-confirm-password" class="form-label">Confirm Password</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="register-confirm-password" name="confirm-password" class="form-input" placeholder="Re-enter password" autocomplete="new-password" required minlength="8" style="padding-right: 44px;">
            <button type="button" class="password-toggle" aria-label="Toggle confirm password visibility">
              <span class="icon-eye">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
              <span class="icon-eye-off" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </span>
            </button>
          </div>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="form-group" style="margin-bottom: var(--space-4);">
          <label class="form-check" for="terms-agreement" style="cursor: pointer; align-items: flex-start;">
            <input type="checkbox" id="terms-agreement" name="terms" required style="margin-top: 3px;">
            <span style="font-size: var(--fs-xs); color: var(--text-secondary); line-height: var(--lh-snug);">
              I agree to the <a href="#" style="color: var(--color-primary); font-weight: var(--fw-medium);">Terms of Service</a>, <a href="#" style="color: var(--color-primary); font-weight: var(--fw-medium);">Privacy Policy</a>, and academic integrity commitments of BrightPath Academy Tutoring Center.
            </span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-full">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" style="color: var(--color-primary);">Sign In</a>
      </div>
    </div>
  </main>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
